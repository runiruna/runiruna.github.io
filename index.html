<!DOCTYPE html>
<html lang="en">
  <head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Document</title>
  </head>
  <body>

        <div style="background-color: whitesmoke; height: 350px; width: 400px;">      


<!--My Information-->
<h2>My Information</h2>
<form action="#" method="" style="margin-top : 5px; margin-left : 5px;">
    <fieldset>
        <legend>Personal </legend>
        <label>Name</label>
         <input type="text" id="name" name="name"> <br>
        Email  <input type="email" id="email"/> <br>   

 </fieldset> <br>
 <br> 



        Gender : <input type="radio" id="" name="abc"/> male <input type="radio" id"" name="abc"/> female <br>
<br>
        Education :
         <input type="checkbox"  name="edu" id="ssc" value="SSC"/> SSC 
         <input type="checkbox" name="edu" id="hsc" value="HSC" /> HSC <br>
                                                          
                                                                        
        Address : <textarea cols="12" rows="2" id="address"></textarea> <br>

        <br>

       Location : <select id="loc">
            <option value="Faridpur"> Faridpur </option>
            <option value="Dhaka"> Dhaka </option>
            <option value="Bakshi-Bazar"> Bakshi-Bazar </option>
            <option value="Mirpur"> Mirpur </option>
        </select> <br>
         <br>
        
        
<input type="reset" value="Reset">
<input type="button" value="Save" id="btn_save" onclick="userForm()"> <br>
      <br>
      </form>

<textarea id="output" cols="40" rows="7"></textarea>

</div>

<script>

  function userForm(){
    var userValues = "";
    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    userValues += "Name : " + name + " \n" + "Email : " + email + "\n";

    //var male = document.getElementById("male");



    if(document.getElementById("male").checked){
    userValues += "Gender : " + "Male" + "\n";
  }else{
    userValues += "Gender : " + "Female" + "\n";
  }
  var address = document.getElementById("address").value;
  userValues += "Addrees : " + address + "\n"
  var location = document.getElementById("location").value;
  userValues += "Location : " + location + "\n"

  userValues += "Education : ";
  if(document.getElementById("ssc").checked){
    userValues += "SSC";
  }

  if(document.getElementById("hsc").checked){
    userValues += "HSC";
  }

  document.getElementById("output").innerHTML = userValues;
  document.getElementById("myOutput").innerHTML = userValues;
  console.log(userValues);
  }
</script>




</body>
</html>
